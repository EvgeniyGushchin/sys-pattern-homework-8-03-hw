---
- name: Kube configuration
  hosts: kube_control_plane
  become: yes
  tasks:
    - name: Prepare .kube dir
      file:
        path: "~/.kube"
        state: directory
        mode: '0755'

    - name: Copy conf file
      copy:
        remote_src: yes
        src: /etc/kubernetes/admin.conf
        dest: ~/.kube/config
        mode: '0644'