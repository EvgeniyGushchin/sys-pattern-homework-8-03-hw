- name: Deploy app
  hosts: kube_control_plane
  gather_facts: true
  become: false

  tasks:
  - name: Copy app_deployment
    ansible.builtin.copy:
      src: 'app_deployment.yml'
      dest: '~/'
      mode: '0644'

  - name: Copy app_service
    ansible.builtin.copy:
      src: 'app_service.yml'
      dest: '~/'
      mode: '0644'

  - name: Deploy app
    ansible.builtin.command:
      cmd: 'kubectl apply -f {{ item }}'
    with_items:
      - '~/app_deployment.yml'
      - '~/app_service.yml'